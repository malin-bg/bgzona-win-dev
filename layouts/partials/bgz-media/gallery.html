<section class="bgz-media-collection" data-media-collection="{{ .Section }}" aria-labelledby="media-collection-title">
  <header class="page-header"><h1 id="media-collection-title">{{ if eq .Section "poslaniya" }}Послания, цитати и размисли{{ else }}{{ .Title }}{{ end }}</h1></header>
  {{ with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
  <div id="media-gallery" class="media-grid">
    {{ range .RegularPages.ByParam "number" }}
    <figure class="media-card" data-media-id="{{ .Params.stem }}">
      <a class="full-preview media-thumbnail" data-full="{{ .Params.full }}" data-page="{{ .Permalink }}" data-label="{{ .Title }}" href="{{ .Params.full }}" aria-label="Увеличи {{ .Title }}" aria-haspopup="dialog" aria-controls="media-lightbox">
        <img loading="lazy" src="{{ .Params.thumb }}" width="{{ .Params.thumbwidth }}" height="{{ .Params.thumbheight }}" alt="{{ .Title }}">
      </a>
      {{ with .Params.usertext }}<figcaption class="media-card-description">{{ . }}</figcaption>{{ end }}
      <div class="media-card-controls">{{ partial "bgz-media/actions.html" (dict "page" . "single" false) }}</div>
    </figure>
    {{ end }}
  </div>
</section>
