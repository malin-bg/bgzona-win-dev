{
  "name": "Deploy Hugo site to Pages",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths-ignore": [
        ".github/workflows/hugo.yml",
        "tools/media/delivery.py"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "accepted_cid": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "input_trust": {
          "type": "string",
          "required": false,
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pages",
    "cancel-in-progress": false
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "build": {
      "if": "github.repository == 'malin-bg/bgzona-win-dev' && github.ref == 'refs/heads/main' && github.repository_id == '1149689018' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ((github.actor_id == '353092585' && github.run_attempt == 1 && inputs.accepted_cid != '' && inputs.input_trust != '') || (github.actor_id == '252877943' && inputs.accepted_cid == '' && inputs.input_trust == ''))))",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout current source",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "submodules": "recursive",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Python 3.13.16",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.13.16"
          }
        },
        {
          "name": "Pinned image dependency",
          "run": "python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/media/requirements.txt"
        },
        {
          "name": "Verified Hugo extended 0.155.2",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir \"$RUNNER_TEMP/bgz-hugo\"\ncurl --fail --location --silent --show-error --output \"$RUNNER_TEMP/hugo.tar.gz\" https://github.com/gohugoio/hugo/releases/download/v0.155.2/hugo_extended_0.155.2_linux-amd64.tar.gz\nprintf '%s  %s\\n' '2bf76c75610e75fa5d15fd3dd0e1377c16ce4fa7202713283c744a19323ff419' \"$RUNNER_TEMP/hugo.tar.gz\" | sha256sum --check --strict\ntar -xzf \"$RUNNER_TEMP/hugo.tar.gz\" -C \"$RUNNER_TEMP/bgz-hugo\" hugo\n\"$RUNNER_TEMP/bgz-hugo/hugo\" version"
        },
        {
          "name": "Trusted input, build, current acceptance and seal",
          "shell": "bash",
          "run": "set -euo pipefail\ntrust=tools/media/input-trust.json\nextra=()\nif [[ \"$GITHUB_EVENT_NAME\" == workflow_dispatch && \"$GITHUB_ACTOR_ID\" == 353092585 ]]; then\n  trust=\"$RUNNER_TEMP/bgz-c3-input-trust.json\"\n  python -B - \"$trust\" <<'PY'\nimport hashlib,json,os,re,sys\nfrom pathlib import Path\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event['sender']['id']==353092585 and event['repository']['id']==1149689018\nparams=event['inputs']\nassert set(params)=={'accepted_cid','input_trust'}\nraw=params['input_trust'].encode('utf-8')\nassert 0<len(raw)<=8192 and re.fullmatch('[0-9a-f]{64}',params['accepted_cid'])\nobj=json.loads(raw)\ndef data(x):\n    return json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()\nassert data(obj)==raw and obj['cid']==params['accepted_cid']\nassert hashlib.sha256(data(obj['accepted'])).hexdigest()==obj['cid']\nPath(sys.argv[1]).write_bytes(raw)\nPY\n  extra=(--standard-trust \"$trust\")\nfi\n[[ -f \"$trust\" && ! -L \"$trust\" ]]\ncid=\"$(python -B -c 'import json,re,sys; v=json.load(open(sys.argv[1],encoding=\"utf8\"))[\"cid\"]; assert re.fullmatch(\"[0-9a-f]{64}\",v); print(v)' \"$trust\")\"\npython -B tools/media/delivery.py --work \"$RUNNER_TEMP/bgz-delivery\" --hugo \"$RUNNER_TEMP/bgz-hugo/hugo\" --accepted-cid \"$cid\" \"${extra[@]}\"\npython -B - \"$cid\" <<'PY'\nimport json,os,sys\nfrom html.parser import HTMLParser\nfrom pathlib import Path\nfrom urllib.parse import urlsplit\nroot=Path(os.environ['RUNNER_TEMP'])/'bgz-delivery'\nseal=json.loads((root/'site-seal.json').read_bytes())\nfiles={r['path']:r['sha256'] for r in seal['files']}\ncatalog=json.loads((root/'input/artifact/catalog.json').read_bytes())\npaths={'/media-version.json','/','/kolaji/','/poslaniya/'}\nclass Page(HTMLParser):\n    def __init__(self):super().__init__();self.og=None\n    def handle_starttag(self,t,a):\n        a=dict(a)\n        if t=='meta' and a.get('property')=='og:image':self.og=a.get('content')\nfor row in catalog['items']:\n    if row['state']!='published':continue\n    page=row['page_url'];assert page.startswith('/') and page.endswith('/')\n    doc=Page();doc.feed((root/'candidate/public'/page.lstrip('/')/'index.html').read_text(encoding='utf8'))\n    u=urlsplit(doc.og);assert u.scheme=='https' and u.netloc=='dev.bgzona.win' and not u.query and not u.fragment\n    paths.update((page,row['original'],u.path))\npairs=[]\nfor path in sorted(paths):\n    name=path.lstrip('/')+('index.html' if path.endswith('/') else '')\n    assert name in files and (root/'candidate/public'/name).stat().st_size<=16_000_000\n    pairs.append([path,files[name]])\nwire=json.dumps(pairs,separators=(',',':'),ensure_ascii=True)\nassert len(wire.encode())<=64000\nwith open(os.environ['GITHUB_OUTPUT'],'a',encoding='ascii') as f:\n    f.write('cid='+sys.argv[1]+'\\nchecks='+wire+'\\n')\nPY",
          "id": "input"
        },
        {
          "name": "Verify accepted output immediately before upload",
          "shell": "bash",
          "run": "python -B tools/media/artifact_seal.py verify --root \"$RUNNER_TEMP/bgz-delivery/candidate/public\" --manifest \"$RUNNER_TEMP/bgz-delivery/site-seal.json\" --expected-digest \"$(cat \"$RUNNER_TEMP/bgz-delivery/site-tree.sha256\")\""
        },
        {
          "name": "Upload exactly accepted Pages output",
          "uses": "actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa",
          "with": {
            "name": "github-pages",
            "path": "${{ runner.temp }}/bgz-delivery/candidate/public",
            "retention-days": 1
          }
        }
      ],
      "outputs": {
        "cid": "${{ steps.input.outputs.cid }}",
        "checks": "${{ steps.input.outputs.checks }}"
      }
    },
    "deploy": {
      "needs": "build",
      "if": "github.repository == 'malin-bg/bgzona-win-dev' && github.ref == 'refs/heads/main' && needs.build.result == 'success'",
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Deploy this run accepted Pages artifact",
          "id": "deployment",
          "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e",
          "with": {
            "artifact_name": "github-pages"
          }
        },
        {
          "name": "Verify public DEV CID, page and OG against the seal",
          "shell": "bash",
          "env": {
            "CID": "${{ needs.build.outputs.cid }}",
            "CHECKS": "${{ needs.build.outputs.checks }}"
          },
          "run": "set -euo pipefail\npython -B - <<'PY'\nimport hashlib,json,os,re,time\nfrom concurrent.futures import ThreadPoolExecutor\nfrom urllib.request import Request,build_opener,HTTPRedirectHandler\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self,*a,**kw):return None\ncid=os.environ['CID'];assert re.fullmatch('[0-9a-f]{64}',cid)\npairs=json.loads(os.environ['CHECKS']);assert pairs and len(pairs)==len({p for p,h in pairs})\nfor p,h in pairs:\n    assert p.startswith('/') and not p.startswith('//') and '..' not in p.split('/') and '\\\\' not in p\n    assert re.fullmatch('[0-9a-f]{64}',h)\ndef check(pair):\n    path,want=pair;url='https://dev.bgzona.win'+path\n    with build_opener(NoRedirect).open(Request(url+'?cid='+cid,headers={'Cache-Control':'no-cache'}),timeout=10) as r:\n        assert r.status==200 and r.geturl().split('?')[0]==url\n        raw=r.read(16_000_001)\n    assert len(raw)<=16_000_000 and hashlib.sha256(raw).hexdigest()==want\n    if path=='/media-version.json':assert json.loads(raw)['cid']==cid and json.loads(raw)['channel']=='dev'\ndeadline=time.monotonic()+90\nwhile True:\n    try:\n        with ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(check,pairs))\n        print('PUBLIC_DEV_VERIFIED',cid,len(pairs));break\n    except Exception:\n        if time.monotonic()>=deadline:raise SystemExit('WAIT_VISIBILITY: independently read back the same deployment')\n        time.sleep(5)\nPY"
        }
      ]
    }
  },
  "run-name": "DEV ${{ inputs.accepted_cid || github.sha }}"
}
