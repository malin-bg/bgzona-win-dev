{
  "name": "Deploy Hugo site to Pages",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pages",
    "cancel-in-progress": false
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "build": {
      "if": "github.repository == 'malin-bg/bgzona-win-dev' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout current source",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "submodules": "recursive",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Python 3.13.16",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.13.16"
          }
        },
        {
          "name": "Pinned image dependency",
          "run": "python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/media/requirements.txt"
        },
        {
          "name": "Verified Hugo extended 0.155.2",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir \"$RUNNER_TEMP/bgz-hugo\"\ncurl --fail --location --silent --show-error --output \"$RUNNER_TEMP/hugo.tar.gz\" https://github.com/gohugoio/hugo/releases/download/v0.155.2/hugo_extended_0.155.2_linux-amd64.tar.gz\nprintf '%s  %s\\n' '2bf76c75610e75fa5d15fd3dd0e1377c16ce4fa7202713283c744a19323ff419' \"$RUNNER_TEMP/hugo.tar.gz\" | sha256sum --check --strict\ntar -xzf \"$RUNNER_TEMP/hugo.tar.gz\" -C \"$RUNNER_TEMP/bgz-hugo\" hugo\n\"$RUNNER_TEMP/bgz-hugo/hugo\" version"
        },
        {
          "name": "Trusted input, build, current acceptance and seal",
          "shell": "bash",
          "run": "set -euo pipefail\ntrust=tools/media/input-trust.json\n[[ -f \"$trust\" && ! -L \"$trust\" ]]\ncid=\"$(python -B -c 'import json,re,sys; v=json.load(open(sys.argv[1],encoding=\"utf8\"))[\"cid\"]; assert re.fullmatch(\"[0-9a-f]{64}\",v); print(v)' \"$trust\")\"\npython -B tools/media/delivery.py --work \"$RUNNER_TEMP/bgz-delivery\" --hugo \"$RUNNER_TEMP/bgz-hugo/hugo\" --accepted-cid \"$cid\"\npython -B - \"$cid\" <<'PY'\nimport json,os,re,sys\nfrom pathlib import Path\nseal=Path(os.environ['RUNNER_TEMP'])/'bgz-delivery'/'site-seal.json'\nfiles={r['path']:r['sha256'] for r in json.loads(seal.read_bytes())['files']}\nog,=[p for p in files if re.fullmatch(r'poslaniya/og/bgzona-m-00019-[0-9a-f]{12}\\.(png|jpg)',p)]\nwith open(os.environ['GITHUB_OUTPUT'],'a',encoding='ascii') as f:\n    for k,v in dict(cid=sys.argv[1],page_sha=files['poslaniya/p-00019/index.html'],\n                    og_path=og,og_sha=files[og],version_sha=files['media-version.json']).items():\n        f.write(f'{k}={v}\\n')\nPY",
          "id": "input"
        },
        {
          "name": "Verify accepted output immediately before upload",
          "shell": "bash",
          "run": "python -B tools/media/artifact_seal.py verify --root \"$RUNNER_TEMP/bgz-delivery/candidate/public\" --manifest \"$RUNNER_TEMP/bgz-delivery/site-seal.json\" --expected-digest \"$(cat \"$RUNNER_TEMP/bgz-delivery/site-tree.sha256\")\""
        },
        {
          "name": "Upload exactly accepted Pages output",
          "uses": "actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa",
          "with": {
            "name": "github-pages",
            "path": "${{ runner.temp }}/bgz-delivery/candidate/public",
            "retention-days": 1
          }
        }
      ],
      "outputs": {
        "cid": "${{ steps.input.outputs.cid }}",
        "page_sha": "${{ steps.input.outputs.page_sha }}",
        "og_path": "${{ steps.input.outputs.og_path }}",
        "og_sha": "${{ steps.input.outputs.og_sha }}",
        "version_sha": "${{ steps.input.outputs.version_sha }}"
      }
    },
    "deploy": {
      "needs": "build",
      "if": "github.repository == 'malin-bg/bgzona-win-dev' && github.ref == 'refs/heads/main' && needs.build.result == 'success'",
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Deploy this run accepted Pages artifact",
          "id": "deployment",
          "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e",
          "with": {
            "artifact_name": "github-pages"
          }
        },
        {
          "name": "Verify public DEV CID, page and OG against the seal",
          "shell": "bash",
          "env": {
            "CID": "${{ needs.build.outputs.cid }}",
            "PAGE_SHA": "${{ needs.build.outputs.page_sha }}",
            "OG_PATH": "${{ needs.build.outputs.og_path }}",
            "OG_SHA": "${{ needs.build.outputs.og_sha }}",
            "VERSION_SHA": "${{ needs.build.outputs.version_sha }}"
          },
          "run": "set -euo pipefail\npython -B - <<'PY'\nimport hashlib,json,os,re,time\nfrom urllib.request import Request,urlopen\nbase='https://dev.bgzona.win/'\ncid=os.environ['CID']\nog=os.environ['OG_PATH']\npairs={'media-version.json':os.environ['VERSION_SHA'],'poslaniya/p-00019/':os.environ['PAGE_SHA'],og:os.environ['OG_SHA']}\nassert all(re.fullmatch('[0-9a-f]{64}',v) for v in [cid,*pairs.values()])\nassert re.fullmatch(r'poslaniya/og/bgzona-m-00019-[0-9a-f]{12}\\.(png|jpg)',og)\ndeadline=time.monotonic()+90\nwhile True:\n    try:\n        for path,wanted in pairs.items():\n            request=Request(base+path+'?cid='+cid,headers={'Cache-Control':'no-cache'})\n            with urlopen(request,timeout=8) as response:\n                assert response.status==200 and response.geturl().split('?')[0]==base+path\n                raw=response.read(8_000_001)\n            assert len(raw)<=8_000_000 and hashlib.sha256(raw).hexdigest()==wanted\n            if path=='media-version.json':\n                assert json.loads(raw)['cid']==cid\n        print('PUBLIC_DEV_VERIFIED',cid,base+'poslaniya/p-00019/')\n        break\n    except Exception:\n        if time.monotonic()>=deadline:\n            raise SystemExit('WAIT_VISIBILITY: independently read back the same deployment')\n        time.sleep(5)\nPY"
        }
      ]
    }
  }
}
